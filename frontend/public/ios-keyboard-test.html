<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>iOS Keyboard Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        html { background: #003366; }

        body {
            font-family: -apple-system, sans-serif;
            background: #003366;
            color: #fff;
        }

        .container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #1a0000;
            border: 4px solid red;
        }

        .topbar {
            flex-shrink: 0;
            padding: 12px 16px;
            padding-top: calc(12px + env(safe-area-inset-top));
            background: #cc3300;
            color: #fff;
            font-weight: 700;
            font-size: 16px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            background: #003366;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overscroll-behavior: contain;
        }

        .message {
            padding: 10px 14px;
            background: #004488;
            border: 2px solid #0077cc;
            border-radius: 8px;
            font-size: 14px;
            color: #cce5ff;
        }

        .input-area {
            flex-shrink: 0;
            padding: 12px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            background: #006633;
            border-top: 3px solid #00cc66;
            display: flex;
            gap: 8px;
        }

        .input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid #00cc66;
            border-radius: 8px;
            background: #003d1f;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        .input-area button {
            padding: 10px 20px;
            background: #00cc66;
            color: #003d1f;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
        }

        .debug {
            position: fixed;
            top: 25%;
            left: 0;
            right: 0;
            background: rgba(255, 0, 255, 0.9);
            color: #fff;
            font-size: 11px;
            padding: 4px 8px;
            z-index: 9999;
            pointer-events: none;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="topbar">
            TOPBAR (orange-red) &mdash; iOS Keyboard Test
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input id="msg-input" type="text" placeholder="Type here to open keyboard..." enterkeyhint="send" autocapitalize="sentences">
            <button id="send-btn">Send</button>
        </div>
    </div>
    <div class="debug" id="debug">debug</div>

    <script>
        // Fill messages
        const messagesDiv = document.getElementById('messages');
        for (let i = 1; i <= 40; i++) {
            const el = document.createElement('div');
            el.className = 'message';
            el.textContent = `Message #${i} — scroll me to test`;
            messagesDiv.appendChild(el);
        }
        requestAnimationFrame(() => {
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        // Debug overlay
        const debugEl = document.getElementById('debug');
        function updateDebug(extra) {
            const vv = window.visualViewport;
            const container = document.getElementById('container');
            debugEl.textContent = [
                `vv: ${vv ? Math.round(vv.height) : '?'}x${vv ? Math.round(vv.width) : '?'}`,
                `vv.offsetTop: ${vv ? Math.round(vv.offsetTop) : '?'}`,
                `window.innerH: ${window.innerHeight}`,
                `container.h: ${container.style.height || 'auto'}`,
                `container.top: ${container.style.top || 'auto'}`,
                extra || ''
            ].join(' | ');
        }

        // Scroll reset (from your app.js)
        window.scrollTo(0, 0);
        window.addEventListener('scroll', () => {
            if (window.scrollY !== 0) window.scrollTo(0, 0);
        });

        // visualViewport handler — only override when keyboard is open
        if (window.visualViewport) {
            const container = document.getElementById('container');
            const KEYBOARD_THRESHOLD = 100;
            const fullHeight = window.visualViewport.height; // capture before keyboard

            const onViewportResize = () => {
                const vv = window.visualViewport;
                if (!vv) return;
                const keyboardOpen = (fullHeight - vv.height) > KEYBOARD_THRESHOLD;
                if (keyboardOpen) {
                    // Keyboard open: override inset:0 with explicit height
                    container.style.height = `${vv.height}px`;
                    container.style.bottom = 'auto';
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    updateDebug(`KB OPEN full=${Math.round(fullHeight)} vv=${Math.round(vv.height)}`);
                } else {
                    // Keyboard closed: restore inset:0 behavior
                    container.style.height = '';
                    container.style.bottom = '';
                    updateDebug(`KB CLOSED full=${Math.round(fullHeight)} vv=${Math.round(vv.height)}`);
                }
            };
            window.visualViewport.addEventListener('resize', onViewportResize);
        }

        setInterval(() => updateDebug(), 1000);
    </script>
</body>
</html>
