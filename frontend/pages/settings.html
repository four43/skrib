<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Mini-Chat</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</head>
<body>
    <div class="settings-page">
        <div class="admin-page-header">
            <div class="admin-page-header-content">
                <h1>Settings</h1>
            </div>
            <a href="/app.html" class="admin-back-btn">Back to App</a>
        </div>

        <div class="settings-layout">
            <nav class="settings-nav">
                <button class="settings-nav-item active" data-section="account">
                    <span class="settings-nav-icon">&#x1F464;</span>
                    Account
                </button>
                <button class="settings-nav-item" data-section="appearance">
                    <span class="settings-nav-icon">&#x1F3A8;</span>
                    Appearance
                </button>
            </nav>

            <div class="settings-content">
                <!-- Account Section -->
                <div class="settings-panel-section active" id="section-account">
                    <div class="admin-section">
                        <h3>Profile</h3>
                        <div class="settings-user-identity">
                            <span id="current-user" class="settings-username"></span>
                            <span id="admin-badge" class="admin-badge hidden">ADMIN</span>
                        </div>
                        <div class="preference-item">
                            <label for="user-nickname">Nickname:</label>
                            <div class="preference-input-group">
                                <input type="text" id="user-nickname" class="preference-input" maxlength="32" placeholder="Enter nickname...">
                                <button id="clear-nickname-btn" class="btn-ghost">Clear</button>
                            </div>
                        </div>
                    </div>

                    <div class="admin-section">
                        <h3>Session</h3>
                        <button id="settings-logout-btn" class="reject-btn">Logout</button>
                    </div>
                </div>

                <!-- Appearance Section -->
                <div class="settings-panel-section" id="section-appearance">
                    <div class="admin-section">
                        <h3>Color Scheme</h3>
                        <div class="color-scheme-picker" id="color-scheme-picker">
                            <button class="color-scheme-option active" data-scheme="auto" type="button">
                                <span class="color-scheme-icon">&#x1F5A5;</span>
                                Auto
                            </button>
                            <button class="color-scheme-option" data-scheme="light" type="button">
                                <span class="color-scheme-icon">&#x2600;</span>
                                Light
                            </button>
                            <button class="color-scheme-option" data-scheme="dark" type="button">
                                <span class="color-scheme-icon">&#x1F319;</span>
                                Dark
                            </button>
                        </div>
                    </div>

                    <div class="admin-section">
                        <h3>Your Color</h3>
                        <div class="preference-item">
                            <label for="user-color">Username color:</label>
                            <input type="color" id="user-color" value="#1976d2">
                        </div>
                    </div>

                    <div class="admin-section">
                        <h3>Theme</h3>
                        <div id="theme-list" class="theme-list">
                            <!-- Theme cards populated by JS -->
                        </div>
                    </div>

                    <div class="admin-section">
                        <h3>Theme Customization</h3>
                        <div class="preference-item">
                            <label for="user-theme-color">Accent color override:</label>
                            <div class="preference-input-group">
                                <input type="color" id="user-theme-color" value="#6366f1">
                                <button id="reset-theme-color-btn" class="btn-ghost">Reset</button>
                            </div>
                        </div>
                    </div>

                    <div class="admin-section">
                        <h3>Preview</h3>
                        <div id="theme-preview-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/settings.js"></script>
</body>
</html>
