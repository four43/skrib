<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Settings - Skrīb</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="stylesheet" href="/src/settings.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f1f5f9">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <script async src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
    <script>
        // Apply dark mode before first paint to prevent white flash
        // Apply dark mode + theme before first paint to prevent flash
        (function(){var s=localStorage.getItem('skrib-color-scheme')||'auto';var d=s==='dark'||(s==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);if(d)document.documentElement.toggleAttribute('data-theme-dark',true);var t=localStorage.getItem('skrib-theme');if(t){var l=document.createElement('link');l.id='theme-stylesheet';l.rel='stylesheet';l.href='/api/themes/'+t;document.head.appendChild(l)}})();
        if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    </script>
</head>
<body>
    <div class="settings-page">
        <div class="page-header">
            <div class="page-header-content">
                <h1>Settings</h1>
            </div>
            <a href="/app.html" class="close-btn" title="Back to App"><iconify-icon icon="lucide:x"></iconify-icon></a>
        </div>

        <div class="settings-layout">
            <nav class="settings-nav">
                <button class="settings-nav-item active" data-section="account">
                    <span class="settings-nav-icon"><iconify-icon icon="lucide:user"></iconify-icon></span>
                    Account
                </button>
                <button class="settings-nav-item" data-section="appearance">
                    <span class="settings-nav-icon"><iconify-icon icon="lucide:palette"></iconify-icon></span>
                    Appearance
                </button>
                <button class="settings-nav-item" data-section="servers">
                    <span class="settings-nav-icon"><iconify-icon icon="lucide:monitor"></iconify-icon></span>
                    Servers
                </button>
            </nav>

            <div class="settings-content">
                <!-- Account Section -->
                <div class="settings-panel-section active" id="section-account">
                    <div class="page-section">
                        <h3>Profile</h3>
                        <div class="settings-user-identity">
                            <span id="current-user" class="settings-username"></span>
                            <span id="admin-badge" class="admin-badge hidden">ADMIN</span>
                        </div>
                        <div class="preference-item">
                            <label for="user-nickname">Nickname:</label>
                            <input type="search" id="user-nickname" class="preference-input" maxlength="32" placeholder="Enter nickname...">
                        </div>
                        <div class="preference-item">
                            <label for="user-status-text">Status:</label>
                            <div class="status-input-wrapper">
                                <button type="button" id="status-emoji-btn" class="status-emoji-btn" title="Pick emoji">
                                    <span id="status-emoji-display">☺</span>
                                </button>
                                <input type="search" id="user-status-text" class="preference-input status-text-input" maxlength="128" placeholder="What's your status?">
                                <input type="hidden" id="user-status-emoji">
                            </div>
                        </div>
                    </div>

                    <div class="page-section">
                        <h3>Session</h3>
                        <button id="settings-logout-btn" class="reject-btn">Logout</button>
                    </div>
                </div>

                <!-- Appearance Section -->
                <div class="settings-panel-section" id="section-appearance">
                    <div class="page-section">
                        <h3>Color Scheme</h3>
                        <div class="color-scheme-picker" id="color-scheme-picker">
                            <button class="color-scheme-option active" data-scheme="auto" type="button">
                                <span class="color-scheme-icon"><iconify-icon icon="lucide:sun-moon"></iconify-icon></span>
                                Auto
                            </button>
                            <button class="color-scheme-option" data-scheme="light" type="button">
                                <span class="color-scheme-icon"><iconify-icon icon="lucide:sun"></iconify-icon></span>
                                Light
                            </button>
                            <button class="color-scheme-option" data-scheme="dark" type="button">
                                <span class="color-scheme-icon"><iconify-icon icon="lucide:moon"></iconify-icon></span>
                                Dark
                            </button>
                        </div>
                    </div>

                    <div class="page-section">
                        <h3>Your Color</h3>
                        <div class="preference-item">
                            <label for="user-color">Username color:</label>
                            <input type="color" id="user-color" value="#1976d2">
                        </div>
                    </div>

                    <div class="page-section">
                        <h3>Theme</h3>
                        <div id="theme-list" class="theme-list">
                            <!-- Theme cards populated by JS -->
                        </div>
                    </div>

                    <div class="page-section">
                        <h3>Preview</h3>
                        <div id="theme-preview-container"></div>
                    </div>
                </div>

                <!-- Servers Section -->
                <div class="settings-panel-section" id="section-servers">
                    <div class="page-section">
                        <h3>Your Servers</h3>
                        <p class="form-hint" style="margin-bottom: 12px;">Manage your list of Skrib servers. The current server is always pinned at the top.</p>
                        <div id="settings-server-list"></div>
                    </div>
                    <div class="page-section">
                        <h3>Add Server</h3>
                        <div class="preference-item">
                            <label for="settings-add-server-url">Server URL</label>
                            <div class="preference-input-group">
                                <input type="text" id="settings-add-server-url" class="preference-input"
                                       placeholder="https://chat.example.com"
                                       autocapitalize="none" autocomplete="url" autocorrect="off" spellcheck="false">
                                <button id="settings-add-server-btn" class="btn-sm" disabled>Add</button>
                            </div>
                            <p class="form-hint">Enter the full URL of a Skrib instance</p>
                        </div>
                        <div id="settings-add-server-status"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/settings.js"></script>
</body>
</html>
