<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Room Settings - Skrīb</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f1f5f9">
    <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <script>
        // Apply dark mode + theme before first paint to prevent flash
        (function(){var s=localStorage.getItem('skrib-color-scheme')||'auto';var d=s==='dark'||(s==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);if(d)document.documentElement.toggleAttribute('data-theme-dark',true);var t=localStorage.getItem('skrib-theme');if(t){var l=document.createElement('link');l.id='theme-stylesheet';l.rel='stylesheet';l.href='/api/themes/'+t;document.head.appendChild(l)}})();
        if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    </script>
</head>
<body>
    <div class="admin-page">
        <div class="admin-page-header">
            <div class="admin-page-header-content">
                <h1 id="room-settings-title">Room Settings</h1>
            </div>
            <a href="/app.html" class="admin-back-btn">Back to App</a>
        </div>

        <div class="admin-page-content">
            <!-- Room Info Section -->
            <div class="admin-section">
                <h3>Room Information</h3>
                <div class="preference-item">
                    <label>Room name:</label>
                    <span id="room-name-display" class="room-name-display"></span>
                </div>
                <div class="preference-item">
                    <label for="room-topic">Topic:</label>
                    <input type="text" id="room-topic" class="preference-input" maxlength="200" placeholder="No topic set" disabled>
                </div>
            </div>

            <!-- Members Section -->
            <div class="admin-section">
                <h3>Members (<span id="member-count">0</span>)</h3>
                <div id="members-list" class="members-list"></div>
            </div>

            <!-- Leave Room (channels only) -->
            <div id="leave-room-section" class="admin-section hidden">
                <h3>Membership</h3>
                <p class="leave-room-description">Leave this channel. You will need to be re-invited to rejoin.</p>
                <button id="leave-room-btn" class="leave-room-btn">Leave Room</button>
            </div>

            <!-- Danger Zone (Admin/Op only) -->
            <div id="danger-zone" class="admin-section hidden">
                <h3>Danger Zone</h3>
                <p class="danger-zone-description">Deleting a room hides it from the room list. Messages are preserved.</p>
                <button id="delete-room-btn" class="reject-btn btn-sm">Delete Room</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/room-settings.js"></script>
</body>
</html>
