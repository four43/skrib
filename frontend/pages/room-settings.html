<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Settings - Mini-Chat</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</head>
<body>
    <div class="admin-page">
        <div class="admin-page-header">
            <div class="admin-page-header-content">
                <h1 id="room-settings-title">Room Settings</h1>
            </div>
            <a href="/app.html" class="admin-back-btn">Back to App</a>
        </div>

        <div class="admin-page-content">
            <!-- Room Info Section -->
            <div class="admin-section">
                <h3>Room Information</h3>
                <div class="preference-item">
                    <label>Room name:</label>
                    <span id="room-name-display" class="room-name-display"></span>
                </div>
                <div class="preference-item">
                    <label for="room-topic">Topic:</label>
                    <div class="preference-input-group">
                        <input type="text" id="room-topic" class="preference-input" maxlength="200" placeholder="No topic set">
                        <button id="save-topic-btn" class="btn-ghost">Save</button>
                    </div>
                </div>
            </div>

            <!-- Members Section -->
            <div class="admin-section">
                <h3>Members (<span id="member-count">0</span>)</h3>
                <div id="members-list" class="members-list"></div>
            </div>

            <!-- Danger Zone (Admin/Op only) -->
            <div id="danger-zone" class="admin-section hidden">
                <h3>Danger Zone</h3>
                <p class="danger-zone-description">Deleting a room hides it from the room list. Messages are preserved.</p>
                <button id="delete-room-btn" class="reject-btn btn-sm">Delete Room</button>
            </div>
        </div>
    </div>

    <script type="module" src="/src/room-settings.js"></script>
</body>
</html>
