<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - Skrīb</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f1f5f9">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <script async src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
    <script>
        // Apply dark mode + theme before first paint to prevent flash
        (function(){var s=localStorage.getItem('skrib-color-scheme')||'auto';var d=s==='dark'||(s==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);if(d)document.documentElement.toggleAttribute('data-theme-dark',true);var t=localStorage.getItem('skrib-theme');if(t){var l=document.createElement('link');l.id='theme-stylesheet';l.rel='stylesheet';l.href='/api/themes/'+t;document.head.appendChild(l)}})();
        if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    </script>
</head>
<body>
    <!-- Login View -->
    <div id="auth-view" class="auth-container">
        <div class="auth-box">
            <div id="login-form">
                <div class="auth-server-branding">
                    <img id="server-icon" class="auth-server-icon" src="/api/server/icon" alt="">
                    <div>
                        <h1 id="server-name"></h1>
                        <p class="auth-powered-by">a <iconify-icon icon="lucide:pen-tool" inline></iconify-icon> Skrīb server</p>
                    </div>
                </div>

                <!-- Spinner shown while checking session -->
                <div id="auth-loading" style="text-align:center">
                    <div class="spinner"></div>
                </div>

                <!-- Buttons hidden until session check completes -->
                <div id="auth-actions" style="display:none">
                    <div id="auth-status"></div>

                    <button id="login-button"><iconify-icon icon="lucide:key-round" inline></iconify-icon> Sign In</button>
                    <div id="register-section" class="hidden">
                        <div class="divider">
                            <span>OR</span>
                        </div>
                        <button id="go-to-register-button"><iconify-icon icon="lucide:user" inline></iconify-icon> Register</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/login.js"></script>
</body>
</html>
