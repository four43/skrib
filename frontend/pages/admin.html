<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Admin - Skrīb</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f1f5f9">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
    <script>
        // Apply dark mode + theme before first paint to prevent flash
        (function(){var s=localStorage.getItem('skrib-color-scheme')||'auto';var d=s==='dark'||(s==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);if(d)document.documentElement.toggleAttribute('data-theme-dark',true);var t=localStorage.getItem('skrib-theme');if(t){var l=document.createElement('link');l.id='theme-stylesheet';l.rel='stylesheet';l.href='/api/themes/'+t;document.head.appendChild(l)}})();
        if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    </script>
</head>
<body>
    <div class="settings-page">
        <div class="admin-page-header">
            <div class="admin-page-header-content">
                <h1>Admin Panel</h1>
            </div>
            <a href="/app.html" class="admin-back-btn">Back to App</a>
        </div>

        <div class="settings-layout">
            <nav class="settings-nav">
                <button class="settings-nav-item active admin-only" data-section="server">
                    <span class="settings-nav-icon"><iconify-icon icon="lucide:settings"></iconify-icon></span>
                    Server
                </button>
                <button class="settings-nav-item admin-only" data-section="appearance">
                    <span class="settings-nav-icon"><iconify-icon icon="lucide:palette"></iconify-icon></span>
                    Appearance
                </button>
                <button class="settings-nav-item" data-section="users">
                    <span class="settings-nav-icon"><iconify-icon icon="lucide:users"></iconify-icon></span>
                    Users
                </button>
                <button class="settings-nav-item admin-only hidden" data-section="invites" id="invites-nav-item">
                    <span class="settings-nav-icon"><iconify-icon icon="lucide:link"></iconify-icon></span>
                    Invites
                </button>
            </nav>

            <div class="settings-content">
                <!-- Server Section -->
                <div class="settings-panel-section active admin-only" id="section-server">
                    <div class="admin-section">
                        <h3>Server Name</h3>
                        <div class="preference-item">
                            <label for="server-name-input">Name:</label>
                            <input type="text" id="server-name-input" class="preference-input" maxlength="64" placeholder="My Server">
                        </div>
                    </div>

                    <div class="admin-section">
                        <h3>Server Icon</h3>
                        <div class="server-icon-section">
                            <div class="server-icon-preview">
                                <img id="server-icon-img" src="" alt="Server icon" width="64" height="64">
                                <span id="server-icon-label" class="server-icon-label"></span>
                            </div>
                            <div class="server-icon-actions">
                                <label class="btn-sm upload-btn" for="server-icon-upload">Upload Icon</label>
                                <input type="file" id="server-icon-upload" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
                                <button class="btn-sm reject-btn" id="server-icon-reset-btn" style="display:none;">Reset to Default</button>
                            </div>
                        </div>
                    </div>

                    <div class="admin-section">
                        <h3>DM Room Type</h3>
                        <p class="form-hint">Plugin used for all direct messages</p>
                        <div id="dm-room-type-select" class="dm-room-type-list"></div>
                    </div>

                    <div class="admin-section">
                        <h3>Registration Mode</h3>
                        <div class="reg-mode-slider">
                            <input type="range" id="reg-mode-slider" min="0" max="3" step="1" value="0">
                            <div class="reg-mode-labels">
                                <span>Closed</span>
                                <span>Invite</span>
                                <span>Approval</span>
                                <span>Open</span>
                            </div>
                            <p id="reg-mode-description" class="reg-mode-description">Registration is closed</p>
                        </div>
                    </div>
                </div>

                <!-- Appearance Section -->
                <div class="settings-panel-section admin-only" id="section-appearance">
                    <div class="admin-section">
                        <h3>Default Theme</h3>
                        <div id="admin-theme-list" class="theme-list">
                            <!-- Theme cards populated by JS -->
                        </div>
                    </div>

                    <div class="admin-section">
                        <h3>Preview</h3>
                        <div id="admin-theme-preview-container"></div>
                    </div>
                </div>

                <!-- Users Section -->
                <div class="settings-panel-section" id="section-users">
                    <div class="admin-section">
                        <h3>Pending Approvals (<span id="pending-count">0</span>)</h3>
                        <div id="pending-list"></div>
                    </div>

                    <div class="admin-section">
                        <h3>All Users (<span id="user-count">0</span>)</h3>
                        <div id="users-list"></div>
                    </div>

                    <div class="admin-section admin-only">
                        <h3>User Preferences</h3>
                        <div id="user-preferences-list"></div>
                    </div>
                </div>

                <!-- Invites Section -->
                <div class="settings-panel-section admin-only" id="section-invites">
                    <div class="admin-section">
                        <h3>Invite Links</h3>
                        <button id="generate-invite-btn" class="invite-generate-btn">Generate Invite Link</button>
                        <div id="invite-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/admin.js"></script>
</body>
</html>
