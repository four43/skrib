<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Register - Skrīb</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <script>
        // Apply dark mode before first paint to prevent white flash
        (function(){var s=localStorage.getItem('skrib-color-scheme')||'auto';var d=s==='dark'||(s==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);if(d)document.documentElement.toggleAttribute('data-theme-dark',true)})();
        if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
    </script>
</head>
<body>
    <!-- Register View -->
    <div id="auth-view" class="auth-container">
        <div class="auth-box">
            <form id="register-form" novalidate>
                <h1>📝 Register</h1>
                <p>Create a new account</p>

                <div id="register-status"></div>

                <div class="form-group">
                    <label for="register-username">Choose a Username</label>
                    <input type="text" id="register-username" placeholder="e.g. cool_user42"
                           required minlength="4" maxlength="15"
                           pattern="[a-zA-Z0-9_]{4,15}"
                           title="4–15 characters: letters, numbers, and underscores only"
                           autocomplete="username"
                           autocapitalize="none"
                           autofocus>
                    <small class="form-hint-small">4–15 characters: letters, numbers, underscores only</small>
                </div>

                <button type="submit" id="register-submit-button">Register</button>
                <button type="button" id="go-to-login-button" class="link-button">Already registered? Sign in</button>
            </form>
        </div>
    </div>

    <script type="module" src="/src/register.js"></script>
</body>
</html>
