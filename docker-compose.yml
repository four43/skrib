services:
  app:
    build:
      context: .
      secrets:
        - github_token
      ssh:
        - default
    image: skrib:latest
    volumes:
      # Mount backend for development hot-reload
      - ./backend:/app
      # Mount frontend for development hot-reload
      - ./frontend:/frontend
      # Mount database to persist data
      - ./data:/data
      # Allow us to map in /tmp
      - "${BITBUCKET_CLONE_DIR:-/tmp}:/tmp"
    environment:
      - PYTHONUNBUFFERED=1
    init: true
    entrypoint: ""
    command:
      - sh
      - -c
      - |
        npm run dev -- --host &
        cd /app && python -m uvicorn skrib.main:app --host 0.0.0.0 --port 8000 --reload

  http-server:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    init: true
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:

secrets:
  github_token:
    environment: GITHUB_TOKEN
