# The production image, as shipped. `runtime` is the last Dockerfile stage, so a
# build with no --target lands here — which makes this file a production smoke
# test: it serves the frontend that was built into the image, as a non-root user,
# with no Node or package manager present.
#
# All development behaviour (dev image target, source mounts, dev server, ports
# 5173/8080) lives in .devcontainer/docker-compose.override.yml.
services:
  app:
    build:
      context: .
    image: skrib:latest
    # Deliberately no source mount: mounting ./ over /app would shadow the
    # frontend build baked into the image and defeat the point of this file.
    volumes:
      # Persist the SQLite DB. The runtime stage sets SKRIB_DATA_DIR=/data.
      - ./data:/data
    init: true
    ports:
      # localhost is a secure context, so Service Workers can be tested
      - "8000:8000"
